<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <title>Trainingstracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app/style.css">
  <!-- iOS nimmt fürs Startbildschirm-Symbol ausschließlich PNG. Ohne diese
       Zeile landet dort ein Bildschirmfoto der Seite. -->
  <link rel="apple-touch-icon" href="app/symbol-180.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚡</text></svg>">
</head>
<body>

<header class="kopf">
  <div class="kopf-inhalt">
    <div class="marke">
      <span class="marke-blitz">⚡</span>
      <span class="marke-text">Trainingstracker</span>
    </div>
    <div class="kopf-status" id="kopfStatus"></div>
  </div>
</header>

<nav class="reiter" id="reiter">
  <button class="reiter-knopf aktiv" data-ansicht="heute"><span class="reiter-symbol"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="2.5" fill="currentColor" stroke="none"/></svg></span>Heute</button>
  <button class="reiter-knopf" data-ansicht="plan"><span class="reiter-symbol"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 2.8v3.2M13 2.8v3.2"/></svg></span>Plan</button>
  <button class="reiter-knopf" data-ansicht="essen"><span class="reiter-symbol"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 3.2v5.4M9 3.2v5.4M7.6 8.6V17M7.6 3.2v3"/><path d="M14.6 3.2c-1.2 1.1-1.8 2.6-1.8 4.2 0 1.2.6 2 1.8 2.2V17"/></svg></span>Essen</button>
  <button class="reiter-knopf" data-ansicht="fortschritt"><span class="reiter-symbol"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.2h14"/><path d="M4.6 12.6l3.6-4 3 2.6 4.2-5.4"/></svg></span>Fortschritt</button>
  <button class="reiter-knopf" data-ansicht="profil"><span class="reiter-symbol"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="6.8" r="3.3"/><path d="M4 16.8c0-3 2.7-4.6 6-4.6s6 1.6 6 4.6"/></svg></span>Profil</button>
  <button class="reiter-knopf" data-ansicht="wissen"><span class="reiter-symbol"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.6C8.6 4.3 6.6 3.7 3.6 3.7v10.6c3 0 5 .6 6.4 1.9 1.4-1.3 3.4-1.9 6.4-1.9V3.7c-3 0-5 .6-6.4 1.9z"/><path d="M10 5.6V16.2"/></svg></span>Wissen</button>
</nav>

<main id="inhalt" class="inhalt">
  <div class="laedt">Lädt …</div>
</main>

<div id="toasts" class="toasts"></div>

<dialog id="dialog" class="dialog">
  <div id="dialogInhalt"></div>
</dialog>

<script type="module" src="app/app.js"></script>
</body>
</html>
